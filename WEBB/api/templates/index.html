<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">
    <main class="max-w-md w-full mx-auto px-6 py-16">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
            <h1 class="text-xl font-bold text-slate-900 mb-2">Panel de Servicio</h1>
            <p class="text-slate-500 text-sm mb-6">Ingresa un texto para probar la función.</p>

            <form id="serviceForm" class="space-y-4">
                <input type="text" id="entrada" required placeholder="Escribe algo..."
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                <button type="submit" id="btnSubmit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition">
                    Procesar
                </button>
            </form>

            <div id="resultBox" class="hidden mt-6 p-4 rounded-xl bg-slate-50 border border-slate-200">
                <p id="resultText" class="text-sm font-medium text-slate-800"></p>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('serviceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const entrada = document.getElementById('entrada').value;
            const resultBox = document.getElementById('resultBox');
            const resultText = document.getElementById('resultText');

            btn.disabled = true;
            btn.textContent = 'Procesando...';

            try {
                const res = await fetch('/api/procesar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ entrada })
                });
                const data = await res.json();
                resultText.textContent = data.resultado;
                resultBox.classList.remove('hidden');
            } catch (err) {
                resultText.textContent = 'Error de conexión.';
                resultBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Procesar';
            }
        });
    </script>
</body>
</html>
